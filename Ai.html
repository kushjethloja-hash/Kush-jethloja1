<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Inter, Arial, sans-serif; }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at 20% 20%, #4936ff33, transparent 30%),
        radial-gradient(circle at 80% 80%, #00d4ff22, transparent 30%),
        #080812;
      color: white;
      overflow: hidden;
    }

    .chat-wrapper {
      width: min(920px, 94vw);
      height: min(720px, 90vh);
      position: relative;
    }

    .glow {
      position: absolute;
      inset: -3px;
      border-radius: 30px;
      background: linear-gradient(120deg, #6c5ce7, #00d4ff, #a855f7, #6c5ce7);
      background-size: 300% 300%;
      animation: glowMove 7s ease infinite;
      filter: blur(12px);
      opacity: 0.55;
    }

    @keyframes glowMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .chat-box {
      position: relative;
      width: 100%;
      height: 100%;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 28px;
      background: rgba(13, 13, 25, 0.88);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .header {
      height: 82px;
      padding: 0 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.025);
    }

    .brand { display: flex; align-items: center; gap: 13px; }

    .ai-logo {
      width: 45px; height: 45px;
      border-radius: 15px;
      display: grid; place-items: center;
      font-size: 21px; font-weight: 800;
      background: linear-gradient(135deg, #7c6cff, #00d4ff);
      box-shadow: 0 0 25px rgba(88, 130, 255, 0.35);
    }

    .brand-text h2 { font-size: 17px; letter-spacing: -0.3px; }
    .brand-text p { margin-top: 3px; font-size: 12px; color: #8f90a5; }

    .online { display: flex; align-items: center; gap: 7px; color: #9fa1b6; font-size: 12px; }
    .online-dot { width: 8px; height: 8px; border-radius: 50%; background: #46e69a; box-shadow: 0 0 12px #46e69a; }

    .messages { flex: 1; padding: 25px; overflow-y: auto; scroll-behavior: smooth; }
    .messages::-webkit-scrollbar { width: 5px; }
    .messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 20px; }

    .message { display: flex; margin-bottom: 18px; animation: messageIn 0.3s ease; }

    @keyframes messageIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user { justify-content: flex-end; }

    .bubble {
      max-width: 75%;
      padding: 14px 17px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message.ai .bubble {
      background: rgba(255,255,255,0.055);
      border: 1px solid rgba(255,255,255,0.08);
      border-bottom-left-radius: 5px;
      color: #e8e8f1;
    }

    .message.user .bubble {
      background: linear-gradient(135deg, #6657ed, #4b7bff);
      border-bottom-right-radius: 5px;
      color: white;
      box-shadow: 0 8px 25px rgba(80,100,255,0.2);
    }

    .welcome {
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      padding: 30px;
    }

    .welcome-icon {
      width: 75px; height: 75px;
      border-radius: 25px;
      display: grid; place-items: center;
      font-size: 32px;
      margin-bottom: 22px;
      background: linear-gradient(135deg, #6657ed, #00c9ff);
      box-shadow: 0 0 45px rgba(80,120,255,0.25);
    }

    .welcome h1 { font-size: clamp(27px, 5vw, 42px); margin-bottom: 10px; letter-spacing: -1.5px; }
    .welcome p { max-width: 500px; color: #898b9f; font-size: 14px; line-height: 1.6; }

    .suggestions { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; margin-top: 25px; }

    .suggestion {
      padding: 9px 13px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      color: #b9bac8;
      border-radius: 12px;
      cursor: pointer;
      font-size: 12px;
      transition: 0.2s;
    }

    .suggestion:hover { background: rgba(255,255,255,0.09); color: white; transform: translateY(-2px); }

    .input-area {
      padding: 18px 20px 20px;
      border-top: 1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.12);
    }

    .input-box {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 8px 8px 8px 16px;
      border: 1px solid rgba(255,255,255,0.11);
      border-radius: 19px;
      background: rgba(255,255,255,0.045);
      transition: 0.25s;
    }

    .input-box:focus-within {
      border-color: rgba(105,120,255,0.6);
      box-shadow: 0 0 25px rgba(90,100,255,0.12);
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 44px;
      max-height: 130px;
      padding: 11px 0;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 14px;
      line-height: 1.5;
    }

    textarea::placeholder { color: #717285; }

    #sendBtn {
      width: 45px; height: 45px;
      flex-shrink: 0;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      color: white;
      font-size: 18px;
      background: linear-gradient(135deg, #6657ed, #497eff);
      box-shadow: 0 8px 20px rgba(76,94,255,0.3);
      transition: 0.2s;
    }

    #sendBtn:hover { transform: translateY(-2px) scale(1.03); }
    #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .footer-text { text-align: center; margin-top: 9px; color: #5f6070; font-size: 10px; }

    .typing { display: flex; gap: 5px; align-items: center; }

    .typing span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #8e8fa4;
      animation: typing 1.2s infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: .4; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    @media (max-width: 600px) {
      .chat-wrapper { width: 100%; height: 100vh; }
      .chat-box { border-radius: 0; }
      .glow { display: none; }
      .bubble { max-width: 88%; }
      .header { padding: 0 17px; }
      .messages { padding: 18px; }
    }
  </style>
</head>

<body>

  <div class="chat-wrapper">
    <div class="glow"></div>

    <div class="chat-box">
      <div class="header">
        <div class="brand">
          <div class="ai-logo">◊</div>
          <div class="brand-text">
            <h2>Zyron AI Assistant</h2>
            <p>Powered by kush jethloja</p>
          </div>
        </div>
        <div class="online">
          <span class="online-dot"></span>
          Online
        </div>
      </div>

      <div class="messages" id="messages">
        <div class="welcome" id="welcome">
          <div class="welcome-icon">◊</div>
          <h1>How can I help?</h1>
          <p>Ask me anything. I can help you write, explain ideas, generate content and more.</p>

          <div class="suggestions">
            <button class="suggestion" onclick="useSuggestion('Explain artificial intelligence in simple words')">Explain AI</button>
            <button class="suggestion" onclick="useSuggestion('Give me some creative website ideas')">Website ideas</button>
            <button class="suggestion" onclick="useSuggestion('Write a professional introduction for my website')">Write something</button>
          </div>
        </div>
      </div>

      <div class="input-area">
        <div class="input-box">
          <textarea id="messageInput" placeholder="Message your AI..." rows="1" onkeydown="handleKey(event)"></textarea>
          <button id="sendBtn" onclick="sendMessage()">↑</button>
        </div>
        <div class="footer-text">AI can make mistakes. Check important information.</div>
      </div>
    </div>
  </div>

  <script>
    /* =========================================
       ⚙️ SIRF YAHAN APNI GROQ API KEY DAALEIN
       ========================================= */
    const API_KEY = "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";
    const MODEL = "openai/gpt-oss-120b";

    /* ========================================= */

    const API_URL = "https://api.groq.com/openai/v1/chat/completions"; 

    const messages = document.getElementById("messages"); 
    const input = document.getElementById("messageInput"); 
    const sendBtn = document.getElementById("sendBtn"); 
    const welcome = document.getElementById("welcome"); 

    let conversation = [ 
      { 
        role: "system", 
        content: "You are a helpful, friendly AI assistant. You can communicate fluently in English, Hindi, and Gujarati. Detect the language used by the user and reply in the same language. If the user writes in English, reply in English. If the user writes in Hindi, reply in Hindi. If the user writes in Gujarati, reply in Gujarati. If the user mixes English, Hindi, and Gujarati, reply naturally using the same mixed language style. Always understand and respond clearly in English, Hindi, or Gujarati."
      } 
    ]; 

    function useSuggestion(text) { 
      input.value = text; 
      input.focus(); 
      sendMessage(); 
    } 

    function handleKey(event) { 
      if (event.key === "Enter" && !event.shiftKey) { 
        event.preventDefault(); 
        sendMessage(); 
      } 
    } 

    function addMessage(text, type) { 
      if (welcome) welcome.remove(); 

      const message = document.createElement("div"); 
      message.className = "message " + type; 

      const bubble = document.createElement("div"); 
      bubble.className = "bubble"; 
      bubble.textContent = text; 

      message.appendChild(bubble); 
      messages.appendChild(message); 
      messages.scrollTop = messages.scrollHeight; 
      return message; 
    } 

    function showTyping() { 
      const message = document.createElement("div"); 
      message.className = "message ai"; 
      message.id = "typingMessage"; 
      message.innerHTML = ` 
        <div class="bubble"> 
          <div class="typing"> 
            <span></span><span></span><span></span> 
          </div> 
        </div> 
      `; 
      messages.appendChild(message); 
      messages.scrollTop = messages.scrollHeight; 
    } 

    function removeTyping() { 
      const typing = document.getElementById("typingMessage"); 
      if (typing) typing.remove(); 
    } 

    async function sendMessage() { 
      const text = input.value.trim(); 
      if (!text || sendBtn.disabled) return; 

      addMessage(text, "user"); 
      conversation.push({ role: "user", content: text }); 

      input.value = ""; 
      input.style.height = "44px"; 
      sendBtn.disabled = true; 
      showTyping(); 

      try { 
        const response = await fetch(API_URL, { 
          method: "POST", 
          headers: { 
            "Content-Type": "application/json", 
            "Authorization": "Bearer " + API_KEY 
          }, 
          body: JSON.stringify({ 
            model: MODEL, 
            messages: conversation, 
            temperature: 0.7, 
            max_tokens: 512 
          }) 
        }); 

        const data = await response.json(); 
        removeTyping(); 

        if (!response.ok) { 
          addMessage("Error: " + (data.error?.message || "Unknown error"), "ai"); 
          sendBtn.disabled = false; 
          return; 
        } 

        if (data.choices && data.choices.length > 0) { 
          const reply = data.choices[0].message.content; 
          addMessage(reply, "ai"); 
          conversation.push({ role: "assistant", content: reply }); 

          if (conversation.length > 21) { 
            conversation = [conversation[0], ...conversation.slice(-20)]; 
          } 
        } else { 
          addMessage("No response from AI.", "ai"); 
        } 
      } catch (error) { 
        removeTyping(); 
        addMessage("Connection error: " + error.message, "ai"); 
        console.error(error); 
      } finally { 
        sendBtn.disabled = false; 
        input.focus(); 
      } 
    } 

    input.addEventListener("input", function () { 
      this.style.height = "44px"; 
      this.style.height = Math.min(this.scrollHeight, 130) + "px"; 
    }); 
  </script> 

</body> 
</html>
